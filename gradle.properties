# Derleyici belleği: GitHub'ın derleme makinesinde 7 GB var.
# Gradle (küçültme adımı dahil) 3 GB, Kotlin derleyicisi 2 GB alır; kalanı sisteme bırakılır.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
# Derleme önbelleği: değişmeyen parçalar bir önceki derlemeden hazır alınır.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
