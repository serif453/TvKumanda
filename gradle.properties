# Derleyici belleği: repo herkese açık olduğundan GitHub'ın derleme makinesinde 16 GB var (gizli repoda 7 GB'tı).
# Gradle (küçültme adımı dahil) 6 GB, Kotlin derleyicisi 3 GB alır; kalanı sisteme bırakılır.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
# Derleme önbelleği: değişmeyen parçalar bir önceki derlemeden hazır alınır.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
