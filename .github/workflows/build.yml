name: APK Derle

on:
  push:
    # Yalnızca bu dosyalar değiştiyse uygulama değişmez; derleme ve yeni sürüm yapılmaz.
    # Gerekirse Actions > APK Derle > Run workflow ile elle derlenebilir.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki derleme aynı numarayı almasın
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sıradaki sürüm numarasını hesapla
        run: |
          # Yalnızca başarıyla yayınlanmış sürümler sayılır; hata veren derleme numara tüketmez.
          last=$(git tag -l 'v0.*' | sed 's/^v0\.//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          # Bu repoda henüz sürüm yokken numara eski repodan devam eder (oradaki son sürüm 0.95'ti).
          next=$(( ${last:-95} + 1 ))
          echo "APP_VERSION=$next" >> "$GITHUB_ENV"
          echo "PREV_TAG=${last:+v0.$last}" >> "$GITHUB_ENV"
          echo "Sıradaki sürüm: 0.$next (önceki: ${last:+v0.$last})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Dış eylemler sabit bir sürüme kilitli: sonradan değiştirilseler bile bu derlemeye bulaşamaz.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.7"

      - name: İmza anahtarını hazırla
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 sırrı eksik (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK derle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          # Süre raporu: en uzun süren adımlar derleme sayfasında not olarak görünür
          gradle --init-script .github/gradle/sure-raporu.gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILED|Exception" build.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: APK'yı yeniden adlandır
        run: |
          cp app/build/outputs/apk/release/app-release.apk TvKumanda-0.${{ env.APP_VERSION }}.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: TvKumanda-0.${{ env.APP_VERSION }}
          path: TvKumanda-0.${{ env.APP_VERSION }}.apk

      - name: Sürüm notlarını hazırla
        run: |
          # Önceki sürüm yoksa (bu repodaki ilk sürüm) yalnızca son değişiklik yazılır.
          range=${PREV_TAG:+$PREV_TAG..}HEAD
          [ -z "$PREV_TAG" ] && range="-1 HEAD"
          {
            echo "Değişiklikler:"
            echo
            git log --no-merges --format='- %s' $range
          } > notes.md
          cat notes.md

      - name: Release olarak yayınla (telefondan direkt indirilebilir)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v0.${{ env.APP_VERSION }}
          name: TV Kumanda 0.${{ env.APP_VERSION }}
          files: TvKumanda-0.${{ env.APP_VERSION }}.apk
          body_path: notes.md
