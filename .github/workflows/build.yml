name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: İmza anahtarını hazırla
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 sırrı eksik (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK derle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:" build.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: APK'yı yeniden adlandır
        run: |
          cp app/build/outputs/apk/release/app-release.apk TvKumanda-0.${{ github.run_number }}.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: TvKumanda-0.${{ github.run_number }}
          path: TvKumanda-0.${{ github.run_number }}.apk

      - name: Sürüm notlarını hazırla
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo "Değişiklikler:"
            echo
            git log --no-merges --format='- %s' $range
          } > notes.md
          cat notes.md

      - name: Release olarak yayınla (telefondan direkt indirilebilir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: TV Kumanda 0.${{ github.run_number }}
          files: TvKumanda-0.${{ github.run_number }}.apk
          body_path: notes.md
