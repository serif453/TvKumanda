name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk TvKumanda.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: TvKumanda-apk
          path: TvKumanda.apk

      - name: Release olarak yayınla (telefondan direkt indirilebilir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: TV Kumanda 0.${{ github.run_number }}
          files: TvKumanda.apk
