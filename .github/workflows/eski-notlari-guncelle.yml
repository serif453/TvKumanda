name: Eski sürüm notlarını güncelle

# Elle çalıştırılır: Actions sekmesi > "Eski sürüm notlarını güncelle" > Run workflow.
# .github/release-notes/<etiket>.md dosyalarındaki metni ilgili sürümün notu yapar.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notları güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in .github/release-notes/*.md; do
            tag=$(basename "$f" .md)
            gh release edit "$tag" --notes-file "$f" && echo "güncellendi: $tag"
          done
