name: Geçmiş temizliğini tamamla

# GEÇİCİ. Elle bir kez çalıştırılır: Actions > "Geçmiş temizliğini tamamla" > Run workflow.
# 1) Eski imza anahtarıyla imzalanmış 12 sürümü ve etiketlerini siler (v1–v5, v0.6, v0.7, v0.10–v0.14).
# 2) Kalan 80 sürümün etiketini temizlenmiş geçmişteki aynı commit'e taşır. Sürümler, notlar ve APK'lar yerinde kalır.
# İş bitince bu dosya silinir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eski 12 sürümü ve etiketlerini sil
        run: |
          for t in v1 v2 v3 v4 v5 v0.6 v0.7 v0.10 v0.11 v0.12 v0.13 v0.14; do
            if gh release view "$t" -R "$REPO" >/dev/null 2>&1; then
              gh release delete "$t" -R "$REPO" --yes --cleanup-tag
              echo "silindi: $t"
            elif git ls-remote --exit-code origin "refs/tags/$t" >/dev/null; then
              git push origin ":refs/tags/$t"
              echo "yalnızca etiket silindi: $t"
            else
              echo "zaten yok: $t"
            fi
          done

      - name: Kalan 80 etiketi temiz geçmişe taşı
        run: |
          refs=""
          while read -r t sha; do
            [ -z "$t" ] && continue
            git cat-file -e "$sha^{commit}" || { echo "::error::$t için commit bulunamadı: $sha"; exit 1; }
            git tag -f "$t" "$sha" >/dev/null
            refs="$refs refs/tags/$t"
