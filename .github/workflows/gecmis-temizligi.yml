          echo "taşınacak etiket: $(echo $refs | wc -w)"
          git push -f origin $refs

      - name: Kontrol
        run: |
          git fetch -q -f --prune --prune-tags origin
          echo "Kalan sürüm: $(gh release list -R "$REPO" -L 500 | wc -l)"
          echo "Kalan etiket: $(git tag | wc -l)"
          if git log --all --format='%ae %ce' | grep -qi '@gmail\.com'; then echo "::error::Geçmişte hâlâ gerçek e-posta var"; exit 1; fi
          if [ -n "$(git log --all --format=%h -- app/debug.keystore)" ]; then echo "::error::Geçmişte hâlâ eski anahtar var"; exit 1; fi
          echo "Tamam: geçmişte eski anahtar ve gerçek e-posta yok."
